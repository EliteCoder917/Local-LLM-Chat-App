appId: com.local.aiide
productName: Local AI IDE
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!__pycache__"
      - "!**/__pycache__/**"
  - from: python-dist
    to: python-dist
    filter:
      - "**/*"
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# Auto-update: installed apps poll GitHub Releases on this repo and download
# new versions when published. Requires a GH_TOKEN env var (Personal Access
# Token with `repo` scope) set when running `npm run release` so the
# publisher can upload the .exe + latest.yml to a new GitHub Release.
publish:
  provider: github
  owner: EliteCoder917
  repo: Local-LLM-Chat-App
