[project]
name = "local-ai-ide-backend"
version = "0.1.0"
description = "Backend for Local AI IDE"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
